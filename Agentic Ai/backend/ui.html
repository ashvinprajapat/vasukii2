<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vasukii — JKLU Autonomous Facility & Venue Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #050811;
      color: #F8FAFC;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background-image: 
        radial-gradient(at 20% 0%, rgba(249, 115, 22, 0.08) 0px, transparent 50%),
        radial-gradient(at 80% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
        radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 24px 24px;
    }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .glass-card {
      background: rgba(13, 19, 33, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070B14; }
    ::-webkit-scrollbar-thumb { background: #1E293B; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API_BASE = window.location.origin.includes("localhost") || window.location.origin.includes("127.0.0.1")
      ? window.location.origin
      : "http://localhost:8000";

    const DEMO_ACCOUNTS = [
      {
        name: "Aarav Sharma",
        initials: "AS",
        roleTitle: "Student Event Organizer",
        role: "organizer",
        email: "organizer@jklu.edu.in",
        password: "jklu@2026",
        badge: "Venue, Lab & Parking Requester",
        accent: "from-sky-500 to-blue-600",
        pill: "bg-sky-500/10 text-sky-400 border-sky-500/20"
      },
      {
        name: "Dr. Amar Nath Patra",
        initials: "AP",
        roleTitle: "Faculty Coordinator",
        role: "faculty",
        email: "faculty@jklu.edu.in",
        password: "faculty@2026",
        badge: "Academic & MDC Suite Privileges",
        accent: "from-indigo-500 to-purple-600",
        pill: "bg-indigo-500/10 text-indigo-400 border-indigo-500/20"
      },
      {
        name: "Rajeshwar Singh",
        initials: "RS",
        roleTitle: "Estate & Facility Admin",
        role: "admin",
        email: "admin@jklu.edu.in",
        password: "admin@2026",
        badge: "HITL Approval Gate & Timetable Parser Authority",
        accent: "from-orange-500 to-amber-500",
        pill: "bg-orange-500/10 text-orange-400 border-orange-500/20"
      }
    ];

    const DEMO_SCENARIOS = [
      {
        tag: "CLASH RECOVERY",
        title: "AI Workshop (EB1-101 / TB-106)",
        prompt: "We want to book Classroom EB1-101 or Lab TB-106 on Monday (2026-11-16) from 09:00 to 10:50 for a 45-student AI Coding Workshop. If they have scheduled classes, tell me which exact course/faculty is clashing and book a genuinely free lab or classroom instead."
      },
      {
        tag: "MULTI-RESOURCE",
        title: "150-Seat Talk + 2 MDC + 2 VIP Parking",
        prompt: "Book a 150-person guest lecture on Tuesday (2026-11-17) from 14:00 to 16:00 in an Amphitheatre, plus reserve 2 MDC Guest House Executive rooms for our external speakers and 2 VIP Visitor Parking slots near Gate 1."
      },
      {
        tag: "COMPOUND LAB",
        title: "Joint Lab Check (TB-102/108)",
        prompt: "Check if Lab TB-108 is free on Tuesday (2026-11-17) from 09:00 to 10:50 for a hardware quiz of 35 students. If busy, recommend another free Tech Block lab and stage the booking."
      }
    ];

    function FormattedAgentResponse({ text }) {
      if (!text) return null;
      const lines = text.split("\n");

      const formatInline = (str) => {
        const parts = str.split(/(\*\*.*?\*\*|`.*?`)/g);
        return parts.map((part, i) => {
          if (part.startsWith("**") && part.endsWith("**")) {
            return <strong key={i} className="text-white font-semibold">{part.slice(2, -2)}</strong>;
          }
          if (part.startsWith("`") && part.endsWith("`")) {
            return <code key={i} className="font-mono text-[11px] bg-slate-900/90 text-orange-300 border border-slate-700/70 px-1.5 py-0.5 rounded">{part.slice(1, -1)}</code>;
          }
          return part;
        });
      };

      return (
        <div className="space-y-2.5 text-sm text-slate-300">
          {lines.map((line, idx) => {
            const trimmed = line.trim();
            if (!trimmed) return <div key={idx} className="h-1" />;
            if (trimmed.startsWith("### ")) {
              return (
                <div key={idx} className="flex items-center gap-2 pt-3 pb-1.5 border-b border-slate-800/80">
                  <span className="w-1.5 h-4 rounded-full bg-orange-500"></span>
                  <h4 className="text-xs font-bold uppercase tracking-wider text-white">
                    {formatInline(trimmed.replace("### ", ""))}
                  </h4>
                </div>
              );
            }
            if (trimmed.startsWith("- ")) {
              const content = trimmed.slice(2).replace("❌", "").replace("✅", "").trim();
              const isClash = trimmed.includes("CLASH") || trimmed.includes("❌");
              const isFree = trimmed.includes("Selected") || trimmed.includes("✅");
              return (
                <div
                  key={idx}
                  className={`p-3 rounded-xl border text-xs flex items-start gap-3 transition ${
                    isClash
                      ? "bg-rose-950/20 border-rose-500/25 text-rose-200/90"
                      : isFree
                      ? "bg-emerald-950/25 border-emerald-500/30 text-emerald-100 shadow-sm"
                      : "bg-slate-900/60 border-slate-800/80 text-slate-300"
                  }`}
                >
                  <span className={`mt-0.5 px-1.5 py-0.5 rounded text-[10px] font-mono font-bold shrink-0 ${
                    isClash ? "bg-rose-500/20 text-rose-400" : isFree ? "bg-emerald-500/20 text-emerald-400" : "bg-slate-800 text-slate-400"
                  }`}>
                    {isClash ? "CLASH" : isFree ? "MATCH" : "INFO"}
                  </span>
                  <div className="flex-1 leading-relaxed">{formatInline(content)}</div>
                </div>
              );
            }
            return <p key={idx} className="text-xs text-slate-300 leading-relaxed">{formatInline(trimmed)}</p>;
          })}
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      const [loginEmail, setLoginEmail] = useState("organizer@jklu.edu.in");
      const [loginPass, setLoginPass] = useState("jklu@2026");
      const [loginError, setLoginError] = useState("");

      const [activeTab, setActiveTab] = useState("console");
      const [selectedDay, setSelectedDay] = useState("Monday");
      const [categoryFilter, setCategoryFilter] = useState("all");
      const [searchRoom, setSearchRoom] = useState("");

      const [prompt, setPrompt] = useState(DEMO_SCENARIOS[0].prompt);
      const [simulateFailover, setSimulateFailover] = useState(false);
      const [loadingAgent, setLoadingAgent] = useState(false);
      const [agentOutput, setAgentOutput] = useState(null);
      const [openTraceIdx, setOpenTraceIdx] = useState(0);

      const [dashboard, setDashboard] = useState({
        resources: [], timetables: [], total_timetable_slots: 0, bookings: [], audit_logs: [], policies: []
      });
      const [uploadingFile, setUploadingFile] = useState(false);
      const [uploadStatus, setUploadStatus] = useState(null);

      const fetchOverview = async (day = selectedDay) => {
        try {
          const res = await fetch(`${API_BASE}/api/dashboard/overview?day=${day}`);
          const data = await res.json();
          setDashboard(data);
        } catch (err) {
          console.error("Failed to fetch overview:", err);
        }
      };

      useEffect(() => {
        if (user) fetchOverview(selectedDay);
      }, [selectedDay, user]);

      const handleLogin = (e) => {
        e.preventDefault();
        const found = DEMO_ACCOUNTS.find(
          (acc) => acc.email.toLowerCase() === loginEmail.trim().toLowerCase() && acc.password === loginPass
        );
        if (!found) {
          setLoginError("Invalid credentials. Select any Demo Role Card on the right to sign in.");
          return;
        }
        setLoginError("");
        setUser(found);
      };

      const handleRunAgent = async (e) => {
        e.preventDefault();
        if (!prompt.trim()) return;
        setLoadingAgent(true);
        try {
          const res = await fetch(`${API_BASE}/api/agent/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              prompt,
              organizer_email: user.email,
              simulate_primary_failure: simulateFailover
            })
          });
          const data = await res.json();
          setAgentOutput(data);
          setOpenTraceIdx(0);
          fetchOverview(selectedDay);
        } catch (err) {
          alert("Backend error: Ensure FastAPI is running on port 8000.");
        } finally {
          setLoadingAgent(false);
        }
      };

      const handleAdminDecision = async (bookingId, decision) => {
        if (user.role !== "admin") return;
        await fetch(`${API_BASE}/api/admin/approve`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            booking_id: bookingId,
            decision,
            admin_remarks: `${decision} by ${user.name} via HITL Gate`
          })
        });
        fetchOverview(selectedDay);
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setUploadingFile(true);
        setUploadStatus(null);
        const formData = new FormData();
        formData.append("file", file);
        try {
          const res = await fetch(`${API_BASE}/api/admin/upload-timetable`, {
            method: "POST",
            body: formData
          });
          const data = await res.json();
          if (!res.ok) {
            alert(data.detail || "Upload failed");
          } else {
            setUploadStatus(data);
            fetchOverview(selectedDay);
          }
        } catch (err) {
          alert("Upload failed");
        } finally {
          setUploadingFile(false);
        }
      };

      // Export Utilisation Report as downloadable CSV
      const exportUtilisationCSV = () => {
        const rows = [
          ["Resource ID", "Venue Name", "Category", "Building", "Capacity", "Scheduled Lectures (" + selectedDay + ")", "Event Bookings", "Utilisation %"]
        ];
        (dashboard.resources || []).forEach((r) => {
          const ttCount = (dashboard.timetables || []).filter((t) => t.resource_id === r.id).length;
          const bkCount = (dashboard.bookings || []).filter((b) => b.resource_id === r.id && b.day_of_week === selectedDay && b.status !== "REJECTED").length;
          const utilPct = Math.min(100, Math.round(((ttCount + bkCount) / 8) * 100));
          rows.push([r.id, `"${r.name}"`, r.category, `"${r.building}"`, r.capacity, ttCount, bkCount, `${utilPct}%`]);
        });
        const csvContent = "data:text/csv;charset=utf-8," + rows.map((e) => e.join(",")).join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `JKLU_Vasukii_Utilisation_Report_${selectedDay}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // =======================================================================
      // 1. AUTHENTICATION SCREEN
      // =======================================================================
      if (!user) {
        return (
          <div className="min-h-screen flex items-center justify-center p-6">
            <div className="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-12 glass-card rounded-2xl overflow-hidden">
              <div className="lg:col-span-6 p-10 flex flex-col justify-between border-b lg:border-b-0 lg:border-r border-white/10">
                <div>
                  <div className="flex items-center gap-3.5 mb-8">
                    <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-orange-500 to-amber-500 flex items-center justify-center font-bold text-slate-950 text-lg shadow-lg shadow-orange-500/25">
                      VK
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="font-bold text-lg tracking-tight text-white">Vasukii</span>
                      </div>
                      <p className="text-xs text-slate-400">JK Lakshmipat University • Autonomous Venue & Facility AI</p>
                    </div>
                  </div>

                  <h1 className="text-2xl font-bold text-white tracking-tight mb-2">
                    Sign in to Command Center
                  </h1>
                  <p className="text-xs text-slate-400 leading-relaxed mb-6">
                    Unified agentic orchestration across academic classrooms, labs, amphitheatres, MDC guest suites, and visitor parking bays.
                  </p>

                  {loginError && (
                    <div className="mb-4 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-xs text-rose-300">
                      {loginError}
                    </div>
                  )}

                  <form onSubmit={handleLogin} className="space-y-4">
                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1.5">Institutional Email</label>
                      <input
                        type="email"
                        required
                        value={loginEmail}
                        onChange={(e) => setLoginEmail(e.target.value)}
                        className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white font-mono focus:outline-none focus:border-orange-500 transition"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1.5">Access Password</label>
                      <input
                        type="password"
                        required
                        value={loginPass}
                        onChange={(e) => setLoginPass(e.target.value)}
                        className="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white font-mono focus:outline-none focus:border-orange-500 transition"
                      />
                    </div>
                    <button
                      type="submit"
                      className="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-slate-950 font-bold text-sm py-3 rounded-xl transition shadow-lg shadow-orange-500/20"
                    >
                      Launch Vasukii Workspace →
                    </button>
                  </form>
                </div>

                <div className="pt-6 border-t border-white/10 mt-8 grid grid-cols-3 gap-2 text-center font-mono text-[11px] text-slate-400">
                  <div className="bg-slate-900/60 py-2 rounded-lg border border-white/5">PDF/XLS/CSV</div>
                  <div className="bg-slate-900/60 py-2 rounded-lg border border-white/5">987 Slots</div>
                  <div className="bg-slate-900/60 py-2 rounded-lg border border-white/5">HITL Gate</div>
                </div>
              </div>

              <div className="lg:col-span-6 bg-slate-950/50 p-10 flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-mono uppercase tracking-widest text-orange-400 font-semibold">
                      Evaluation Demo Accounts
                    </span>
                    <span className="text-[11px] font-mono text-slate-400">RBAC Enabled</span>
                  </div>
                  <p className="text-xs text-slate-400 mb-6">
                    Click any role card below to auto-fill credentials or enter that role's workspace in one click:
                  </p>

                  <div className="space-y-3.5">
                    {DEMO_ACCOUNTS.map((acc) => (
                      <div
                        key={acc.role}
                        onClick={() => { setLoginEmail(acc.email); setLoginPass(acc.password); }}
                        className={`p-4 rounded-xl border transition cursor-pointer ${
                          loginEmail === acc.email
                            ? "bg-slate-900/90 border-orange-500/50 shadow-lg"
                            : "bg-slate-900/40 border-white/10 hover:border-white/20"
                        }`}
                      >
                        <div className="flex items-center justify-between mb-2.5">
                          <div className="flex items-center gap-3">
                            <div className={`w-9 h-9 rounded-lg bg-gradient-to-br ${acc.accent} flex items-center justify-center font-bold text-xs text-white`}>
                              {acc.initials}
                            </div>
                            <div>
                              <div className="text-sm font-semibold text-white">{acc.roleTitle}</div>
                              <div className="text-xs text-slate-400">{acc.name}</div>
                            </div>
                          </div>
                          <button
                            type="button"
                            onClick={(e) => { e.stopPropagation(); setUser(acc); }}
                            className="bg-white/10 hover:bg-orange-500 hover:text-slate-950 text-white text-xs font-semibold px-3 py-1.5 rounded-lg transition"
                          >
                            Instant Login →
                          </button>
                        </div>

                        <div className="flex items-center justify-between text-[11px] font-mono bg-slate-950/80 px-3 py-2 rounded-lg border border-white/5 text-slate-300">
                          <span>ID: {acc.email}</span>
                          <span>PW: {acc.password}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                <div className="mt-6 p-3.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-xs text-indigo-300 leading-relaxed">
                  <strong>Judge Walkthrough:</strong> Sign in as <strong>Student Organizer</strong> to stage a venue request, then use the top-right RBAC switcher to flip to <strong>Admin</strong> and approve it.
                </div>
              </div>
            </div>
          </div>
        );
      }

      // =======================================================================
      // 2. MAIN WORKSPACE
      // =======================================================================
      const pendingCount = (dashboard.bookings || []).filter((b) => b.status === "PENDING_APPROVAL").length;
      const approvedCount = (dashboard.bookings || []).filter((b) => b.status === "APPROVED").length;
      const totalResourcesCount = (dashboard.resources || []).length;
      const TIME_SLOTS = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00"];

      const filteredResources = (dashboard.resources || []).filter((r) => {
        const matchesCat = categoryFilter === "all" || r.category === categoryFilter;
        const matchesSearch =
          !searchRoom.trim() ||
          r.id.toLowerCase().includes(searchRoom.toLowerCase()) ||
          r.name.toLowerCase().includes(searchRoom.toLowerCase());
        return matchesCat && matchesSearch;
      });

      const visibleTrace = (agentOutput?.agent_trace || []).filter(
        (t) => simulateFailover || !t.step.includes("FALLBACK")
      );

      // Compute Utilisation Analytics per Category
      const CATEGORY_META = [
        { id: "classroom", label: "Academic Classrooms (EB1 / EB2 / IM / AIC)", color: "bg-sky-500" },
        { id: "laboratory", label: "Tech Block & LRC Laboratories", color: "bg-indigo-500" },
        { id: "amphitheatre", label: "University Amphitheatres", color: "bg-orange-500" },
        { id: "mdc_guest_room", label: "MDC Guest House Suites", color: "bg-emerald-500" },
        { id: "parking_slot", label: "VIP & Visitor Parking Bays", color: "bg-amber-500" }
      ];

      const categoryStats = CATEGORY_META.map((cat) => {
        const catRes = (dashboard.resources || []).filter((r) => r.category === cat.id);
        const totalPossibleSlots = Math.max(1, catRes.length * 8);
        const usedByTimetable = (dashboard.timetables || []).filter((t) =>
          catRes.some((r) => r.id === t.resource_id)
        ).length;
        const usedByBookings = (dashboard.bookings || []).filter(
          (b) => b.day_of_week === selectedDay && b.status !== "REJECTED" && catRes.some((r) => r.id === b.resource_id)
        ).length;
        const pct = Math.min(100, Math.round(((usedByTimetable + usedByBookings) / totalPossibleSlots) * 100));
        return {
          ...cat,
          venueCount: catRes.length,
          usedSlots: usedByTimetable + usedByBookings,
          freeSlots: Math.max(0, totalPossibleSlots - (usedByTimetable + usedByBookings)),
          totalPossibleSlots,
          pct
        };
      });

      return (
        <div className="min-h-screen flex">
          {/* LEFT SIDEBAR */}
          <aside className="w-64 bg-[#080C17]/95 border-r border-white/10 flex flex-col justify-between shrink-0 p-4">
            <div className="space-y-5">
              {/* Brand */}
              <div className="flex items-center gap-3 px-2 pt-1">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 to-amber-500 flex items-center justify-center font-bold text-slate-950 text-base shadow-md shadow-orange-500/20">
                  VK
                </div>
                <div>
                  <div className="font-bold text-base text-white tracking-tight">Vasukii</div>
                  <div className="text-[11px] text-slate-400">JKLU Facility & Venue AI</div>
                </div>
              </div>

              {/* Active User Badge */}
              <div className="p-3.5 rounded-xl bg-slate-900/80 border border-white/10">
                <div className="flex items-center gap-3">
                  <div className={`w-9 h-9 rounded-lg bg-gradient-to-br ${user.accent} flex items-center justify-center font-bold text-xs text-white shrink-0`}>
                    {user.initials}
                  </div>
                  <div className="min-w-0">
                    <div className="text-xs font-bold text-white truncate">{user.name}</div>
                    <div className="text-[11px] text-slate-400 truncate">{user.roleTitle}</div>
                  </div>
                </div>
                <div className="mt-2.5 pt-2.5 border-t border-white/10 flex items-center justify-between text-[10px] font-mono">
                  <span className="text-emerald-400 flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> RBAC ACTIVE
                  </span>
                  <span className="text-slate-400 uppercase">{user.role}</span>
                </div>
              </div>

              {/* Navigation */}
              <nav className="space-y-1.5">
                <div className="px-2 pb-1 text-[10px] font-mono uppercase tracking-wider text-slate-500">
                  Core Workspaces
                </div>
                {[
                  { id: "console", label: "Agent Command Console", badge: "AI" },
                  { id: "matrix", label: "Master Occupancy Grid", badge: totalResourcesCount },
                  { id: "hitl", label: "HITL Approval Queue", badge: pendingCount > 0 ? `${pendingCount} New` : "0", highlight: pendingCount > 0 },
                  { id: "reports", label: "Utilisation Reports", badge: "STATS" },
                  { id: "ingest", label: "Timetable Parser Sync", badge: "PDF/XLS" }
                ].map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition ${
                      activeTab === item.id
                        ? "bg-gradient-to-r from-orange-500 to-amber-500 text-slate-950 shadow-md shadow-orange-500/15"
                        : "text-slate-400 hover:bg-white/5 hover:text-white"
                    }`}
                  >
                    <span className="truncate">{item.label}</span>
                    <span className={`text-[10px] font-mono px-2 py-0.5 rounded-full shrink-0 ${
                      activeTab === item.id
                        ? "bg-slate-950/20 text-slate-950 font-bold"
                        : item.highlight
                        ? "bg-amber-500/20 text-amber-300 border border-amber-500/40"
                        : "bg-slate-800 text-slate-400"
                    }`}>
                      {item.badge}
                    </span>
                  </button>
                ))}
              </nav>
            </div>

            {/* Bottom System Status */}
            <div className="space-y-3 pt-4 border-t border-white/10">
              <div className="p-3 rounded-xl bg-slate-900/50 border border-white/5 space-y-2 text-[11px] font-mono">
                <div className="flex items-center justify-between text-slate-400">
                  <span>Clash Solver</span>
                  <span className="text-emerald-400">{dashboard.total_timetable_slots} Slots</span>
                </div>
                <div className="flex items-center justify-between text-slate-400">
                  <span>Policy RAG</span>
                  <span className="text-sky-400">Grounded</span>
                </div>
                <div className="flex items-center justify-between text-slate-400">
                  <span>HITL Gate</span>
                  <span className="text-orange-400">Enforced</span>
                </div>
              </div>

              <button
                onClick={() => setUser(null)}
                className="w-full py-2 rounded-xl bg-white/5 hover:bg-rose-500/15 hover:text-rose-300 text-slate-400 border border-white/10 text-xs font-semibold transition"
              >
                Sign Out / Switch User
              </button>
            </div>
          </aside>

          {/* RIGHT MAIN AREA */}
          <div className="flex-1 flex flex-col min-w-0">
            {/* STICKY GLASS HEADER */}
            <header className="h-16 bg-[#080C17]/80 backdrop-blur-xl border-b border-white/10 px-8 flex items-center justify-between gap-4 sticky top-0 z-20">
              <div className="min-w-0">
                <h1 className="text-sm font-bold text-white truncate">
                  {activeTab === "console" && "Autonomous Venue, Guest House & Parking Orchestrator"}
                  {activeTab === "matrix" && "Multi-Semester Live Venue Occupancy Matrix"}
                  {activeTab === "hitl" && "Human-in-the-Loop (HITL) Governance & Approval Queue"}
                  {activeTab === "reports" && "Campus Venue Utilisation & Analytics Reports"}
                  {activeTab === "ingest" && "Multi-Format Timetable Parser (PDF / Excel / CSV)"}
                </h1>
                <p className="text-[11px] text-slate-400 truncate">
                  JK Lakshmipat University • Real-time conflict resolution across BTech & BBA Semesters 1–7
                </p>
              </div>

              {/* Non-Wrapping Role Switcher Pill */}
              <div className="flex items-center gap-2.5 shrink-0">
                <span className="text-[11px] font-mono text-slate-400 whitespace-nowrap">Role:</span>
                <div className="flex bg-slate-950 p-1 rounded-xl border border-white/10 text-xs whitespace-nowrap">
                  {DEMO_ACCOUNTS.map((acc) => (
                    <button
                      key={acc.role}
                      onClick={() => setUser(acc)}
                      className={`px-3 py-1.5 rounded-lg transition font-semibold whitespace-nowrap ${
                        user.role === acc.role
                          ? "bg-orange-500 text-slate-950 shadow"
                          : "text-slate-400 hover:text-white"
                      }`}
                    >
                      {acc.role === "organizer" ? "Organizer" : acc.role === "faculty" ? "Faculty" : "Admin"}
                    </button>
                  ))}
                </div>
              </div>
            </header>

            <main className="flex-1 p-8 space-y-6 overflow-y-auto">
              {/* TOP KPI METRIC STRIP */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="glass-card rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <div className="text-[11px] font-mono uppercase text-slate-400">Total Campus Resources</div>
                    <div className="text-2xl font-bold text-white mt-1">{totalResourcesCount}</div>
                    <div className="text-[11px] text-slate-400 mt-0.5">Classrooms, Labs, Amphi, MDC, Parking</div>
                  </div>
                  <div className="w-10 h-10 rounded-xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center font-mono text-indigo-400 font-bold">
                    {totalResourcesCount}
                  </div>
                </div>

                <div className="glass-card rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <div className="text-[11px] font-mono uppercase text-slate-400">Indexed Timetable Slots</div>
                    <div className="text-2xl font-bold text-emerald-400 mt-1">{dashboard.total_timetable_slots}</div>
                    <div className="text-[11px] text-slate-400 mt-0.5">PDF / Excel / CSV Parser Active</div>
                  </div>
                  <div className="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center font-mono text-emerald-400 font-bold text-xs">
                    SYNC
                  </div>
                </div>

                <div
                  onClick={() => setActiveTab("hitl")}
                  className="glass-card rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-amber-500/40 transition"
                >
                  <div>
                    <div className="text-[11px] font-mono uppercase text-slate-400">Pending HITL Gate</div>
                    <div className="text-2xl font-bold text-amber-400 mt-1">{pendingCount}</div>
                    <div className="text-[11px] text-amber-300/80 mt-0.5">Awaiting Admin Sign-off →</div>
                  </div>
                  <div className="w-10 h-10 rounded-xl bg-amber-500/15 border border-amber-500/30 flex items-center justify-center font-mono text-amber-400 font-bold text-xs">
                    HITL
                  </div>
                </div>

                <div
                  onClick={() => setActiveTab("reports")}
                  className="glass-card rounded-2xl p-4 flex items-center justify-between cursor-pointer hover:border-sky-500/40 transition"
                >
                  <div>
                    <div className="text-[11px] font-mono uppercase text-slate-400">Approved Reservations</div>
                    <div className="text-2xl font-bold text-sky-400 mt-1">{approvedCount}</div>
                    <div className="text-[11px] text-slate-400 mt-0.5">View Utilisation Reports →</div>
                  </div>
                  <div className="w-10 h-10 rounded-xl bg-sky-500/15 border border-sky-500/30 flex items-center justify-center font-mono text-sky-400 font-bold text-xs">
                    LIVE
                  </div>
                </div>
              </div>

              {/* WORKSPACE 1: AGENT COMMAND CONSOLE */}
              {activeTab === "console" && (
                <div className="grid grid-cols-12 gap-6">
                  <div className="col-span-12 lg:col-span-7 space-y-6">
                    <div className="glass-card rounded-2xl p-6 space-y-4">
                      <div className="flex items-center justify-between">
                        <div>
                          <span className="text-[10px] font-mono uppercase tracking-widest text-orange-400 font-semibold">
                            Natural Language Command Bar
                          </span>
                          <h2 className="text-base font-bold text-white mt-0.5">
                            What would you like Vasukii to coordinate?
                          </h2>
                        </div>
                        <span className={`text-[11px] font-mono px-2.5 py-1 rounded-full border ${user.pill}`}>
                          {user.email}
                        </span>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-3 gap-2.5">
                        {DEMO_SCENARIOS.map((sc, idx) => (
                          <button
                            key={idx}
                            type="button"
                            onClick={() => setPrompt(sc.prompt)}
                            className={`text-left p-3 rounded-xl border transition ${
                              prompt === sc.prompt
                                ? "bg-orange-500/10 border-orange-500/50"
                                : "bg-slate-950/60 border-white/10 hover:border-white/20"
                            }`}
                          >
                            <div className="text-[10px] font-mono font-bold text-orange-400">{sc.tag}</div>
                            <div className="text-xs font-semibold text-white mt-0.5 truncate">{sc.title}</div>
                          </button>
                        ))}
                      </div>

                      <form onSubmit={handleRunAgent} className="space-y-4">
                        <textarea
                          rows={4}
                          value={prompt}
                          onChange={(e) => setPrompt(e.target.value)}
                          className="w-full bg-slate-950/90 border border-white/10 rounded-xl p-4 text-sm text-white leading-relaxed focus:outline-none focus:border-orange-500 transition"
                        />

                        <div className="flex flex-wrap items-center justify-between gap-3">
                          <label className="flex items-center gap-2 text-xs text-slate-400 cursor-pointer select-none">
                            <input
                              type="checkbox"
                              checked={simulateFailover}
                              onChange={(e) => setSimulateFailover(e.target.checked)}
                              className="rounded bg-slate-900 border-slate-700 text-orange-500"
                            />
                            Include Multi-LLM Failover Telemetry in Trace
                          </label>

                          <button
                            type="submit"
                            disabled={loadingAgent}
                            className="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 disabled:opacity-50 text-slate-950 font-bold text-xs px-6 py-3 rounded-xl transition shadow-lg shadow-orange-500/20"
                          >
                            {loadingAgent ? "Solving Timetable Constraints..." : "Execute Autonomous Workflow →"}
                          </button>
                        </div>
                      </form>
                    </div>

                    {agentOutput && (
                      <div className="glass-card rounded-2xl p-6 space-y-4 border-l-4 border-l-emerald-500">
                        <div className="flex flex-wrap items-center justify-between gap-2 border-b border-white/10 pb-3.5">
                          <div className="flex items-center gap-2.5">
                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
                            <h3 className="text-sm font-bold text-white">Grounded Execution Synthesis</h3>
                          </div>
                          <div className="flex items-center gap-2 text-[11px] font-mono">
                            <span className="bg-indigo-500/15 text-indigo-300 border border-indigo-500/30 px-2.5 py-0.5 rounded-full">
                              {agentOutput.llm_provider}
                            </span>
                            <span className="bg-slate-900 text-slate-400 border border-white/10 px-2.5 py-0.5 rounded-full">
                              {agentOutput.session_id}
                            </span>
                          </div>
                        </div>

                        <FormattedAgentResponse text={agentOutput.response} />

                        <div className="pt-3 border-t border-white/10 flex items-center justify-between text-xs">
                          <span className="text-slate-400">
                            State change paused at <strong className="text-amber-400 font-mono">PENDING_APPROVAL</strong>
                          </span>
                          <button
                            onClick={() => setActiveTab("hitl")}
                            className="bg-orange-500/15 hover:bg-orange-500 hover:text-slate-950 text-orange-400 border border-orange-500/30 font-semibold px-3.5 py-1.5 rounded-lg transition"
                          >
                            Verify in HITL Approval Gate →
                          </button>
                        </div>
                      </div>
                    )}

                    <div className="glass-card rounded-2xl p-6">
                      <div className="flex items-center justify-between mb-4">
                        <div>
                          <span className="text-[10px] font-mono uppercase tracking-widest text-sky-400 font-semibold">
                            Zero-Hallucination Knowledge Base
                          </span>
                          <h3 className="text-sm font-bold text-white">Active Campus Booking SOPs (RAG)</h3>
                        </div>
                        <span className="text-[11px] font-mono text-slate-400">5 Institutional Rules</span>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                        {(dashboard.policies || []).map((pol) => (
                          <div key={pol.id} className="bg-slate-950/70 border border-white/10 p-4 rounded-xl">
                            <div className="text-xs font-bold text-orange-400 mb-1">{pol.rule_title}</div>
                            <p className="text-[11px] text-slate-400 leading-relaxed">{pol.policy_text}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  {/* Right 5 Columns: Interactive Stepper Audit Trace */}
                  <div className="col-span-12 lg:col-span-5">
                    <div className="glass-card rounded-2xl p-6 h-full flex flex-col">
                      <div className="border-b border-white/10 pb-4 mb-5 flex items-center justify-between">
                        <div>
                          <span className="text-[10px] font-mono uppercase tracking-widest text-emerald-400 font-semibold">
                            Explainable AI Telemetry
                          </span>
                          <h2 className="text-base font-bold text-white mt-0.5">Agent Reasoning & Tool Trace</h2>
                        </div>
                        <span className="text-[11px] font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2.5 py-1 rounded-full">
                          {visibleTrace.length} Steps Logged
                        </span>
                      </div>

                      <div className="flex-1 space-y-3 overflow-y-auto max-h-[680px] pr-1">
                        {visibleTrace.length > 0 ? (
                          visibleTrace.map((item, idx) => {
                            const isOpen = openTraceIdx === idx;
                            return (
                              <div
                                key={idx}
                                className="rounded-xl border border-white/10 bg-slate-950/75 overflow-hidden transition"
                              >
                                <button
                                  type="button"
                                  onClick={() => setOpenTraceIdx(isOpen ? -1 : idx)}
                                  className="w-full p-3.5 text-left flex items-center justify-between hover:bg-white/5 transition"
                                >
                                  <div className="flex items-center gap-3">
                                    <span className="w-6 h-6 rounded-lg bg-orange-500/15 border border-orange-500/30 text-orange-400 font-mono text-xs font-bold flex items-center justify-center">
                                      {idx + 1}
                                    </span>
                                    <div>
                                      <div className="text-xs font-bold text-white font-mono">{item.step}</div>
                                      <div className="text-[11px] text-sky-400 font-mono">
                                        {item.tool ? `${item.tool}()` : item.provider}
                                      </div>
                                    </div>
                                  </div>
                                  <span className="text-[10px] font-mono text-slate-400 bg-slate-900 px-2 py-0.5 rounded border border-white/5">
                                    {isOpen ? "Hide JSON ▲" : "Inspect ▼"}
                                  </span>
                                </button>

                                {isOpen && (
                                  <div className="p-3.5 pt-0 border-t border-white/5 space-y-2 font-mono text-[11px]">
                                    {item.arguments && (
                                      <div>
                                        <div className="text-[10px] text-slate-400 mb-1">Tool Input Arguments:</div>
                                        <pre className="bg-black/60 p-2.5 rounded-lg border border-white/5 text-slate-300 overflow-x-auto">
                                          {JSON.stringify(item.arguments, null, 2)}
                                        </pre>
                                      </div>
                                    )}
                                    {item.output && (
                                      <div>
                                        <div className="text-[10px] text-emerald-400 mb-1">Database / Constraint Output:</div>
                                        <pre className="bg-black/60 p-2.5 rounded-lg border border-white/5 text-emerald-300 overflow-x-auto max-h-48">
                                          {JSON.stringify(item.output, null, 2)}
                                        </pre>
                                      </div>
                                    )}
                                    {item.info && <div className="text-amber-300 text-xs pt-1">{item.info}</div>}
                                  </div>
                                )}
                              </div>
                            );
                          })
                        ) : (
                          <div className="text-slate-500 text-xs py-20 text-center border border-dashed border-white/10 rounded-2xl">
                            Run any scenario on the left to inspect the live multi-step tool execution timeline.
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* WORKSPACE 2: LIVE OCCUPANCY MATRIX */}
              {activeTab === "matrix" && (
                <div className="space-y-5">
                  <div className="glass-card rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
                    <div className="flex items-center gap-1.5">
                      {["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"].map((day) => (
                        <button
                          key={day}
                          onClick={() => setSelectedDay(day)}
                          className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                            selectedDay === day
                              ? "bg-orange-500 text-slate-950 shadow"
                              : "bg-slate-950/70 text-slate-400 border border-white/10 hover:text-white"
                          }`}
                        >
                          {day}
                        </button>
                      ))}
                    </div>

                    <div className="flex flex-wrap items-center gap-2 text-xs">
                      <input
                        type="text"
                        placeholder="Filter room (e.g. EB1-101, TB-106)..."
                        value={searchRoom}
                        onChange={(e) => setSearchRoom(e.target.value)}
                        className="bg-slate-950/90 border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-orange-500"
                      />
                      {[
                        { id: "all", label: `All (${totalResourcesCount})` },
                        { id: "classroom", label: "Classrooms" },
                        { id: "laboratory", label: "Labs" },
                        { id: "amphitheatre", label: "Amphitheatres" },
                        { id: "mdc_guest_room", label: "MDC Suites" },
                        { id: "parking_slot", label: "Parking" }
                      ].map((cat) => (
                        <button
                          key={cat.id}
                          onClick={() => setCategoryFilter(cat.id)}
                          className={`px-3 py-2 rounded-xl border font-semibold transition ${
                            categoryFilter === cat.id
                              ? "bg-indigo-500/20 text-indigo-300 border-indigo-500/40"
                              : "bg-slate-950/70 text-slate-400 border-white/10 hover:text-white"
                          }`}
                        >
                          {cat.label}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="glass-card rounded-2xl overflow-hidden">
                    <div className="overflow-x-auto">
                      <table className="w-full text-left border-collapse">
                        <thead>
                          <tr className="border-b border-white/10 bg-slate-950/90 text-[11px] font-mono text-slate-400">
                            <th className="p-4 w-56">Venue / Resource</th>
                            <th className="p-4 w-20">Seats</th>
                            {TIME_SLOTS.map((slot) => (
                              <th key={slot} className="p-4 text-center">{slot}</th>
                            ))}
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-white/5 text-xs">
                          {filteredResources.map((res) => (
                            <tr key={res.id} className="hover:bg-white/[0.02] transition">
                              <td className="p-3.5 font-mono font-bold text-white">
                                <div className="flex items-center gap-2">
                                  <span>{res.id}</span>
                                  <span className="text-[10px] font-normal px-2 py-0.5 bg-white/5 text-slate-300 rounded-full">
                                    {res.category}
                                  </span>
                                </div>
                                <div className="text-[11px] font-sans font-normal text-slate-400 truncate max-w-[200px] mt-0.5">
                                  {res.name}
                                </div>
                              </td>
                              <td className="p-3.5 font-mono text-slate-400">{res.capacity}</td>
                              {TIME_SLOTS.map((slot) => {
                                const ttClash = (dashboard.timetables || []).find(
                                  (t) => t.resource_id === res.id && String(t.start_time).startsWith(slot.slice(0, 2))
                                );
                                const bkClash = (dashboard.bookings || []).find(
                                  (b) =>
                                    b.resource_id === res.id &&
                                    b.day_of_week === selectedDay &&
                                    b.status !== "REJECTED" &&
                                    String(b.start_time) <= slot &&
                                    String(b.end_time) > slot
                                );
                                return (
                                  <td key={slot} className="p-2 text-center">
                                    {ttClash ? (
                                      <div
                                        title={`${ttClash.semester} ${ttClash.section}: ${ttClash.course_name} (${ttClash.faculty})`}
                                        className="bg-rose-500/15 border border-rose-500/30 text-rose-300 rounded-lg px-2 py-1.5 text-[10px] font-mono truncate max-w-[115px] mx-auto"
                                      >
                                        {ttClash.semester} {ttClash.section}
                                      </div>
                                    ) : bkClash ? (
                                      <div
                                        title={`${bkClash.event_title} (${bkClash.status})`}
                                        className={`rounded-lg px-2 py-1.5 text-[10px] font-mono font-semibold truncate max-w-[115px] mx-auto border ${
                                          bkClash.status === "APPROVED"
                                            ? "bg-indigo-500/20 border-indigo-500/40 text-indigo-200"
                                            : "bg-amber-500/20 border-amber-500/40 text-amber-300"
                                        }`}
                                      >
                                        {bkClash.status === "APPROVED" ? "BOOKED" : "HITL PENDING"}
                                      </div>
                                    ) : (
                                      <div className="bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-lg px-2 py-1.5 text-[10px] font-mono">
                                        FREE
                                      </div>
                                    )}
                                  </td>
                                );
                              })}
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

              {/* WORKSPACE 3: HITL APPROVAL GATE */}
              {activeTab === "hitl" && (
                <div className="space-y-5">
                  <div className="glass-card rounded-2xl p-6 flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <span className="text-[10px] font-mono uppercase tracking-widest text-orange-400 font-semibold">
                        Institutional Safety & State Governance
                      </span>
                      <h2 className="text-lg font-bold text-white mt-0.5">
                        Human-in-the-Loop (HITL) Administrator Approval Queue
                      </h2>
                    </div>

                    {user.role !== "admin" ? (
                      <div className="flex items-center gap-3 bg-amber-500/10 border border-amber-500/30 px-4 py-2.5 rounded-xl text-xs text-amber-200">
                        <span>Viewing as <strong>{user.roleTitle}</strong> (Read-Only).</span>
                        <button
                          onClick={() => setUser(DEMO_ACCOUNTS[2])}
                          className="bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition"
                        >
                          Switch to Admin →
                        </button>
                      </div>
                    ) : (
                      <div className="bg-emerald-500/15 border border-emerald-500/30 px-4 py-2 rounded-xl text-xs text-emerald-300 font-mono">
                        ✓ Estate Admin Approval Authority Active ({user.email})
                      </div>
                    )}
                  </div>

                  <div className="glass-card rounded-2xl overflow-hidden">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-slate-950/90 border-b border-white/10 font-mono text-[11px] text-slate-400">
                          <th className="p-4">Booking Group</th>
                          <th className="p-4">Venue ID</th>
                          <th className="p-4">Event & Requester</th>
                          <th className="p-4">Date & Window</th>
                          <th className="p-4">Capacity</th>
                          <th className="p-4">HITL Status</th>
                          <th className="p-4 text-right">Administrator Decision</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-white/5">
                        {(dashboard.bookings || []).map((bk) => (
                          <tr key={bk.id} className="hover:bg-white/[0.02] transition">
                            <td className="p-4 font-mono text-orange-400 font-bold">{bk.booking_group_id}</td>
                            <td className="p-4 font-mono font-bold text-white">{bk.resource_id}</td>
                            <td className="p-4">
                              <div className="font-semibold text-white">{bk.event_title}</div>
                              <div className="text-[11px] text-slate-400 font-mono">{bk.organizer_email}</div>
                            </td>
                            <td className="p-4 font-mono text-slate-300">
                              {bk.booking_date} ({bk.day_of_week})<br />
                              <span className="text-slate-400">
                                {String(bk.start_time).slice(0, 5)} – {String(bk.end_time).slice(0, 5)}
                              </span>
                            </td>
                            <td className="p-4 font-mono">{bk.expected_attendees}</td>
                            <td className="p-4">
                              <span className={`px-2.5 py-1 rounded-full font-mono text-[10px] font-bold border ${
                                bk.status === "APPROVED"
                                  ? "bg-emerald-500/15 border-emerald-500/30 text-emerald-300"
                                  : bk.status === "REJECTED"
                                  ? "bg-rose-500/15 border-rose-500/30 text-rose-300"
                                  : "bg-amber-500/15 border-amber-500/30 text-amber-300"
                              }`}>
                                {bk.status}
                              </span>
                            </td>
                            <td className="p-4 text-right space-x-2">
                              {bk.status === "PENDING_APPROVAL" ? (
                                user.role === "admin" ? (
                                  <>
                                    <button
                                      onClick={() => handleAdminDecision(bk.id, "APPROVED")}
                                      className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3.5 py-1.5 rounded-lg text-xs transition"
                                    >
                                      ✓ Approve
                                    </button>
                                    <button
                                      onClick={() => handleAdminDecision(bk.id, "REJECTED")}
                                      className="bg-rose-500/20 hover:bg-rose-500 hover:text-white text-rose-300 border border-rose-500/30 font-semibold px-3.5 py-1.5 rounded-lg text-xs transition"
                                    >
                                      ✕ Reject
                                    </button>
                                  </>
                                ) : (
                                  <span className="text-[11px] font-mono text-amber-400">Admin Role Required</span>
                                )
                              ) : (
                                <span className="text-[11px] text-slate-500 font-mono">{bk.admin_remarks || "Verified"}</span>
                              )}
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* WORKSPACE 4: VENUE UTILISATION REPORTS (PS-02 DELIVERABLE) */}
              {activeTab === "reports" && (
                <div className="space-y-6">
                  <div className="glass-card rounded-2xl p-6 flex flex-wrap items-center justify-between gap-4">
                    <div>
                      <span className="text-[10px] font-mono uppercase tracking-widest text-orange-400 font-semibold">
                        PS-02 Administrative Deliverable
                      </span>
                      <h2 className="text-lg font-bold text-white mt-0.5">
                        Campus Venue Utilisation & Free-Classroom Discovery Report ({selectedDay})
                      </h2>
                      <p className="text-xs text-slate-400 mt-0.5">
                        Cross-analyzes pre-slotted academic lectures, compound lab sessions, and approved extra-curricular reservations.
                      </p>
                    </div>

                    <div className="flex items-center gap-3">
                      <select
                        value={selectedDay}
                        onChange={(e) => setSelectedDay(e.target.value)}
                        className="bg-slate-950 border border-white/10 rounded-xl px-3.5 py-2 text-xs text-white font-semibold"
                      >
                        {["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"].map((d) => (
                          <option key={d} value={d}>{d}</option>
                        ))}
                      </select>
                      <button
                        onClick={exportUtilisationCSV}
                        className="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl transition shadow-md"
                      >
                        ↓ Export CSV Report
                      </button>
                    </div>
                  </div>

                  {/* Category Utilisation Bars */}
                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-7 glass-card rounded-2xl p-6 space-y-4">
                      <h3 className="text-sm font-bold text-white">
                        Resource Category Occupancy Breakdown ({selectedDay})
                      </h3>
                      <div className="space-y-4">
                        {categoryStats.map((st) => (
                          <div key={st.id} className="space-y-1.5">
                            <div className="flex items-center justify-between text-xs">
                              <span className="font-semibold text-white">{st.label}</span>
                              <span className="font-mono text-slate-300">
                                {st.usedSlots}/{st.totalPossibleSlots} hrs occupied ({st.pct}%) • <strong className="text-emerald-400">{st.freeSlots} Free Slots</strong>
                              </span>
                            </div>
                            <div className="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden border border-white/5">
                              <div className={`h-full ${st.color} rounded-full transition-all duration-500`} style={{ width: `${Math.max(4, st.pct)}%` }}></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="lg:col-span-5 glass-card rounded-2xl p-6 flex flex-col justify-between space-y-4">
                      <div>
                        <span className="text-[10px] font-mono uppercase tracking-widest text-emerald-400 font-semibold">
                          Optimization Summary
                        </span>
                        <h3 className="text-sm font-bold text-white mt-0.5 mb-3">
                          Top Under-Utilised Free Venues Today
                        </h3>
                        <div className="space-y-2.5">
                          {(dashboard.resources || []).slice(0, 5).map((r) => {
                            const used = (dashboard.timetables || []).filter((t) => t.resource_id === r.id).length;
                            const freeHrs = Math.max(0, 8 - used);
                            return (
                              <div key={r.id} className="p-3 rounded-xl bg-slate-950/70 border border-white/10 flex items-center justify-between text-xs">
                                <div>
                                  <div className="font-mono font-bold text-white">{r.id} <span className="font-sans font-normal text-slate-400">({r.name})</span></div>
                                  <div className="text-[11px] text-slate-400">Capacity: {r.capacity} seats • {r.building}</div>
                                </div>
                                <span className="font-mono text-[11px] bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 px-2.5 py-1 rounded-lg">
                                  {freeHrs}h Free
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                      <div className="p-3.5 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-[11px] text-indigo-200">
                        Vasukii automatically prioritizes low-occupancy classrooms and labs when recommending conflict-free alternatives.
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* WORKSPACE 5: MULTI-FORMAT TIMETABLE PARSER */}
              {activeTab === "ingest" && (
                <div className="max-w-2xl mx-auto">
                  <div className="glass-card rounded-2xl p-8 space-y-5">
                    <div>
                      <span className="text-[10px] font-mono uppercase tracking-widest text-orange-400 font-semibold">
                        Multi-Format Timetable Parser
                      </span>
                      <h2 className="text-lg font-bold text-white mt-0.5">
                        Instant Timetable Ingestion (PDF, Excel & CSV)
                      </h2>
                      <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                        Upload any JKLU semester timetable in <strong>.pdf</strong>, <strong>.xlsx / .xls</strong>, or <strong>.csv</strong> format. The parser extracts table rows, normalizes room IDs, expands compound practical labs (e.g., TB-102/108), and updates Supabase in real time.
                      </p>
                    </div>

                    {user.role !== "admin" ? (
                      <div className="p-8 rounded-2xl bg-rose-500/10 border border-rose-500/25 text-center space-y-3">
                        <div className="text-sm font-bold text-rose-300">
                          RBAC Protected Endpoint: Estate Administrator Required
                        </div>
                        <p className="text-xs text-slate-400">
                          Switch to the Estate Admin account to upload and overwrite master semester schedules.
                        </p>
                        <button
                          onClick={() => setUser(DEMO_ACCOUNTS[2])}
                          className="bg-orange-500 hover:bg-orange-400 text-slate-950 font-bold text-xs px-4 py-2.5 rounded-xl transition"
                        >
                          Switch to Admin Account →
                        </button>
                      </div>
                    ) : (
                      <label className="border-2 border-dashed border-slate-700 hover:border-orange-500 rounded-2xl p-12 flex flex-col items-center justify-center cursor-pointer transition bg-slate-950/60">
                        <div className="px-3.5 py-2 rounded-xl bg-orange-500/15 border border-orange-500/30 flex items-center justify-center text-orange-400 font-mono text-xs font-bold mb-3">
                          PDF • XLSX • CSV
                        </div>
                        <span className="text-sm font-bold text-white text-center">
                          {uploadingFile ? "Extracting Tables & Indexing Slots..." : "Click to select Timetable (.PDF, .XLSX, .XLS, or .CSV)"}
                        </span>
                        <span className="text-xs text-slate-400 mt-1 text-center">
                          Automatically parses multi-page PDFs, multi-sheet Excel workbooks, and CSV exports
                        </span>
                        <input type="file" accept=".pdf,.xlsx,.xls,.csv" onChange={handleFileUpload} className="hidden" />
                      </label>
                    )}

                    {uploadStatus && (
                      <div className="bg-emerald-500/15 border border-emerald-500/30 rounded-xl p-4 text-xs text-emerald-200 font-mono space-y-1">
                        <div className="font-bold text-emerald-400">✓ LIVE SUPABASE TIMETABLE SYNC COMPLETE</div>
                        <div>File: {uploadStatus.filename}</div>
                        <div>Raw Rows Parsed: {uploadStatus.raw_rows}</div>
                        <div>Normalized Venue Slots Indexed: {uploadStatus.normalized_slots_inserted}</div>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
